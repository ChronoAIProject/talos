# DEVELOPMENT/TESTING ONLY. Do not use this single-instance database for production.
# Use managed Postgres (Cloud SQL/RDS) or a Postgres operator such as CloudNativePG.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: talos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15
          env:
            - name: POSTGRES_DB
              value: talos
            - name: POSTGRES_USER
              value: talos
            - name: POSTGRES_PASSWORD
              value: change-me
          ports:
            - name: postgres
              containerPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: talos
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
