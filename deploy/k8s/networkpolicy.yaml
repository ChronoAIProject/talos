# Talos network policies for the talos namespace.
#
# IMPORTANT: the existing managed policy talos-cross-namespace-ingress
# selects every pod whose app label is NOT nyxid-backend and allows
# ingress from ALL pods in the namespace (podSelector: {}). NetworkPolicy allows
# are unioned, so as long as that policy also selects the Talos pods, every pod
# in talos can reach Talos and the tighter rules below cannot
# override that. To truly enforce "only NyxID calls Talos", add
# talos-control-plane (and talos-platform-worker if used) to that policy's
# NotIn list:
#   matchExpressions:
#     - {key: app, operator: NotIn, values: [nyxid-backend, talos-control-plane]}
# The same applies to talos-standard-egress if Talos egress should
# be limited to the rules below instead of the namespace-wide standard.
# Until those exclusions are made, Talos still enforces auth at the application
# layer: user routes need a verified NyxID JWT, worker routes a machine-bound
# worker token, admin routes the admin token.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: talos-control-plane
  namespace: talos
spec:
  podSelector:
    matchLabels:
      app: talos-control-plane
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # NyxID backend (production) is the only intended external caller.
    - from:
        - podSelector:
            matchLabels:
              app: nyxid-backend
      ports:
        - port: 8080
          protocol: TCP
    # In-cluster platform workers (claim/heartbeat/result). Remove this rule if
    # no worker Deployment runs in this namespace.
    - from:
        - podSelector:
            matchLabels:
              app: talos-platform-worker
      ports:
        - port: 8080
          protocol: TCP
    # Node CIDR, for kubelet liveness/readiness probes — mirrors the existing
    # 192.0.2.0/24 allowance used by the NyxID backend policy.
    - from:
        - ipBlock:
            cidr: 192.0.2.0/24
      ports:
        - port: 8080
          protocol: TCP
  egress:
    # DNS (kube-dns pods and the GKE metadata DNS used by standard-egress).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
        - ipBlock:
            cidr: 169.254.169.254/32
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # MongoDB — same range the NyxID backend uses. Adjust if Talos gets its
    # own database elsewhere.
    - to:
        - ipBlock:
            cidr: 198.51.100.0/24
      ports:
        - port: 27017
          protocol: TCP
    # Public internet, excluding cluster pod/service ranges (matching the
    # standard-egress except list): JWKS fetch from
    # https://nyxid.example.com and signed webhook callbacks.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 10.244.0.0/16
              - 10.96.0.0/12
              - 169.254.0.0/16
---
# Additive egress for the NyxID backend: its managed egress policy only lists
# specific same-namespace pods, so Talos must be granted explicitly. This
# stands alone next to the managed nyxid-backend-egress policy
# (allows are unioned) — nothing existing is modified. Mirrors the existing
# internal-service:8080 rule pattern.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nyxid-backend-egress-to-talos
  namespace: talos
spec:
  podSelector:
    matchLabels:
      app: nyxid-backend
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: talos-control-plane
      ports:
        - port: 8080
          protocol: TCP
    # House pattern also lists Service ClusterIPs as /32 ipBlocks (service CIDR
    # 10.96.0.0/12). Calico matches post-DNAT pod IPs, so the selector rule
    # should suffice; if proxy calls time out after apply, add the Talos
    # Service ClusterIP here on port 80.
