apiVersion: apps/v1
kind: Deployment
metadata:
  name: talos-control-plane
  namespace: talos
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: talos-control-plane
  template:
    metadata:
      labels:
        app: talos-control-plane
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: control-plane
          image: ghcr.io/example/talos-control-plane:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: talos-secrets
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
