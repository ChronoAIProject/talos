apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: talos
resources:
  - namespace.yaml
  # secret.yaml holds real values and is gitignored; apply it separately or keep it listed here for local kubectl -k use.
  - secret.example.yaml
  - config.yaml
  - networkpolicy.yaml
  - control-plane-deployment.yaml
  - control-plane-service.yaml
  # Apply mongodb.example.yaml only for development/testing.
  # - mongodb.example.yaml
  # - ingress.example.yaml
  # - worker.example.yaml
