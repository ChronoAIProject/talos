apiVersion: v1
kind: Secret
metadata:
  name: talos-secrets
  namespace: talos
type: Opaque
stringData:
  # Replace every placeholder before applying. These are deliberately not real secrets.
  TALOS_WEBHOOK_SECRET: replace-with-a-random-32-byte-secret
  TALOS_ADMIN_TOKEN: replace-with-a-random-admin-token
  TALOS_DATABASE_URL: mongodb://mongodb:27017/talos
  TALOS_NYXID_JWKS_URL: https://nyxid.example/.well-known/jwks.json
  TALOS_NYXID_ISSUER: https://nyxid.example
  TALOS_NYXID_AUDIENCE: talos
  # Alternatively provide TALOS_NYXID_JWT_PUBLIC_KEY with a PEM-encoded RS256 public key.
