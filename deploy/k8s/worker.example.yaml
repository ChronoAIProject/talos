# Platform-pool workers can run as containers. Private/org pools should run the
# daemon directly on real macOS/Windows hardware when headed, residential, or
# computer-use capabilities are required.
# Register this machine through the admin API first and put the returned token in
# the referenced Secret.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: talos-platform-worker
  namespace: talos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: talos-platform-worker
  template:
    metadata:
      labels:
        app: talos-platform-worker
    spec:
      containers:
        - name: worker
          image: ghcr.io/example/talos-worker:latest
          env:
            - name: TALOS_CONTROL_PLANE_URL
              value: http://talos-control-plane
            - name: TALOS_WORKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: TALOS_MACHINE_ID
              value: replace-with-registered-machine-id
            - name: TALOS_WORKER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: talos-worker-token
                  key: TALOS_WORKER_TOKEN
            # Testing requires a Local QA Runtime sidecar or host-loopback service
            # plus an accepted authorization consumer endpoint. Supply all four
            # variables together; omit all four while that integration is disabled.
            # - name: TALOS_TESTING_RUNTIME_URL
            #   value: http://127.0.0.1:4317
            # - name: TALOS_TESTING_RUNTIME_CREDENTIAL
            #   valueFrom:
            #     secretKeyRef: { name: talos-testing-worker, key: runtime-credential }
            # - name: TALOS_TESTING_AUTHORIZATION_RESOLVER_URL
            #   value: https://authorization.example/resolve
            # - name: TALOS_TESTING_AUTHORIZATION_RESOLVER_TOKEN
            #   valueFrom:
            #     secretKeyRef: { name: talos-testing-worker, key: resolver-token }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1
              memory: 1Gi
