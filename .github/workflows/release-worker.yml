name: Release worker

on:
  push:
    tags:
      - 'worker-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Build platform-independent worker bundle
        env:
          TALOS_WORKER_VERSION: ${{ github.ref_name }}
        run: |
          TALOS_WORKER_VERSION="${TALOS_WORKER_VERSION#worker-v}" npm run bundle:worker
          cd worker/release
          sha256sum talos-worker-*.tar.gz > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            worker/release/talos-worker-*.tar.gz
            worker/release/SHA256SUMS
          generate_release_notes: true
