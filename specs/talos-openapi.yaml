openapi: 3.1.0
info:
  title: Talos Task API
  version: 0.1.0
  description: |
    Capability-neutral asynchronous machine-operation tasks for NyxID catalog registration.
    Public requests are scoped by X-NyxID-Identity-Token. Worker endpoints use rotatable
    pool worker tokens and are intended for outbound-only worker connections. Production verifies
    NyxID's short-lived RS256 assertions (sub, iss, aud, exp, iat and groups) using configured key material.
    /healthz, /openapi.json, and /openapi.yaml are unauthenticated operational metadata endpoints
    and are intentionally not listed as catalog operations below.
servers:
  - url: http://talos-control-plane.talos.svc.cluster.local
security:
  - nyxIdentity: []
paths:
  /v1/tools/testing/capabilities:
    get:
      operationId: getTestingCapabilities
      responses:
        '200': { description: Bounded Testing Tool capabilities, content: { application/json: { schema: { $ref: '#/components/schemas/TestingCapabilities' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/tools/testing/runs/{run_id}:
    parameters: [{ $ref: '#/components/parameters/TestingRunId' }]
    put:
      operationId: submitTestingRun
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TestingToolRequest' }
      responses:
        '200': { description: Idempotent replay, content: { application/json: { schema: { $ref: '#/components/schemas/TestingRunAcceptance' } } } }
        '201': { description: Accepted, content: { application/json: { schema: { $ref: '#/components/schemas/TestingRunAcceptance' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
    get:
      operationId: getTestingRun
      responses:
        '200': { description: Bounded immutable run snapshot, content: { application/json: { schema: { $ref: '#/components/schemas/TestingRunSnapshot' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/tools/testing/runs/{run_id}/events:
    parameters:
      - { $ref: '#/components/parameters/TestingRunId' }
      - { name: cursor, in: query, required: false, schema: { type: string, minLength: 32, maxLength: 4096 }, description: Opaque exclusive cursor. }
      - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 100 } }
    get:
      operationId: listTestingRunEvents
      responses:
        '200': { description: Stable bounded event page, content: { application/json: { schema: { $ref: '#/components/schemas/TestingEventPage' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { description: Cursor expired; resync from the replacement snapshot and cursor., content: { application/json: { schema: { $ref: '#/components/schemas/TestingCursorExpiredError' } } } }
  /v1/tools/testing/runs/{run_id}:cancel:
    parameters: [{ $ref: '#/components/parameters/TestingRunId' }]
    post:
      operationId: cancelTestingRun
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TestingCancelRequest' }
      responses:
        '200': { description: Cancel intent acknowledgement, content: { application/json: { schema: { $ref: '#/components/schemas/TestingCancelAck' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/tasks:
    post:
      operationId: submitTask
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskCreate' }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Task' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
  /v1/tasks/{id}:
    parameters: [{ $ref: '#/components/parameters/TaskId' }]
    get:
      operationId: getTask
      responses:
        '200': { description: Task, content: { application/json: { schema: { $ref: '#/components/schemas/Task' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/tasks/{id}/input:
    post:
      operationId: provideTaskInput
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TaskInput' } } }
      responses:
        '200': { description: Updated task, content: { application/json: { schema: { $ref: '#/components/schemas/Task' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/tasks/{id}/handoff:
    post:
      operationId: requestTaskHandoff
      requestBody:
        content: { application/json: { schema: { type: object, properties: { expires_in_seconds: { type: integer, minimum: 1, maximum: 3600, default: 900 } } } } }
      responses:
        '200': { description: Handoff link, content: { application/json: { schema: { $ref: '#/components/schemas/Handoff' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '501': { $ref: '#/components/responses/NotImplemented' }
  /v1/tasks/{id}/cancel:
    post:
      operationId: cancelTask
      responses:
        '200': { description: Cancelled task, content: { application/json: { schema: { $ref: '#/components/schemas/Task' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/sessions:
    post:
      operationId: createSession
      description: Creates an interactive browser session. The external calling agent is the planner; Talos schedules a worker and retains its browser context until close or idle timeout.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SessionCreate' } } }
      responses:
        '201': { description: Created session, content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
  /v1/sessions/{id}:
    parameters: [{ $ref: '#/components/parameters/SessionId' }]
    get:
      operationId: getSession
      description: Returns session state and pending/last action correlation ids.
      responses:
        '200': { description: Session state, content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/sessions/{id}/close:
    parameters: [{ $ref: '#/components/parameters/SessionId' }]
    post:
      operationId: closeSession
      description: Completes a queued session immediately or marks an active session closing so its worker closes the browser and completes the underlying task.
      requestBody: { content: { application/json: { schema: { type: object, additionalProperties: false, maxProperties: 0 } } } }
      responses:
        '200': { description: Closing or completed session, content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/sessions/{id}/actions:
    parameters: [{ $ref: '#/components/parameters/SessionId' }]
    post:
      operationId: sendSessionAction
      description: Enqueues exactly one action and waits up to wait_seconds for its correlated result. A pending response can be resumed through getSessionAction. A second in-flight action returns 409. read_only mode rejects click, type, key, and act-on-a11y-node with mode_forbidden.
      parameters: [{ $ref: '#/components/parameters/WaitSeconds' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SessionActionRequest' } } }
      responses:
        '200': { description: Completed action or pending correlation id, content: { application/json: { schema: { $ref: '#/components/schemas/SessionActionResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
  /v1/sessions/{id}/actions/{actionId}:
    parameters:
      - { $ref: '#/components/parameters/SessionId' }
      - { $ref: '#/components/parameters/ActionId' }
    get:
      operationId: getSessionAction
      description: Long-polls a previously returned action id for up to wait_seconds. pending means the caller may poll again.
      parameters: [{ $ref: '#/components/parameters/WaitSeconds' }]
      responses:
        '200': { description: Completed or pending action, content: { application/json: { schema: { $ref: '#/components/schemas/SessionActionResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/pools:
    get:
      operationId: listOwnedPools
      description: Lists pools owned by the authenticated NyxID user, including any admin-provisioned org pool with that owner.
      responses:
        '200':
          description: Caller-owned pools.
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Pool' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: createOwnedPool
      description: Creates a private or org pool owned by the authenticated NyxID user. Org visibility requires a matching propagated group; an empty shared_with_groups list is owner-only. Platform creation remains admin-only.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PrivatePoolCreate' } } }
      responses:
        '201': { description: Created private or org pool., content: { application/json: { schema: { $ref: '#/components/schemas/Pool' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
  /v1/pools/{id}:
    parameters: [{ $ref: '#/components/parameters/PoolId' }]
    patch:
      operationId: updateOwnedPool
      description: Owner-only update of private/org visibility, tags, and group sharing. Platform visibility is admin-only.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PoolPatch' } } }
      responses:
        '200': { description: Updated pool, content: { application/json: { schema: { $ref: '#/components/schemas/Pool' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
  /v1/pools/{id}/machines:
    parameters: [{ $ref: '#/components/parameters/PoolId' }]
    get:
      operationId: listOwnedPoolMachines
      description: Lists machines in a pool owned by the authenticated NyxID user. Worker token hashes are never returned.
      responses:
        '200':
          description: Machines enrolled in the pool.
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Machine' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: enrollOwnedPoolMachine
      description: Enrolls a machine and returns its server-issued worker token once.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PrivateMachineCreate' } } }
      responses:
        '201': { description: Enrolled machine with one-time worker token., content: { application/json: { schema: { $ref: '#/components/schemas/MachineTokenResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
  /v1/machines/{id}/rotate-token:
    parameters: [{ $ref: '#/components/parameters/MachineId' }]
    post:
      operationId: rotateOwnedMachineToken
      description: Rotates the server-issued worker token for a machine in a caller-owned pool and returns it once.
      requestBody:
        content: { application/json: { schema: { type: object, additionalProperties: false, maxProperties: 0 } } }
      responses:
        '200': { description: Rotated worker token., content: { application/json: { schema: { $ref: '#/components/schemas/MachineTokenResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
  /v1/profiles:
    get:
      operationId: listOwnedProfiles
      description: Lists profiles owned by the authenticated NyxID user without lock internals.
      responses:
        '200':
          description: Caller-owned profiles.
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Profile' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: createOwnedProfile
      description: Creates a profile owned by the authenticated NyxID user. A pinned machine must belong to a caller-owned pool.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PrivateProfileCreate' } } }
      responses:
        '201': { description: Created profile., content: { application/json: { schema: { $ref: '#/components/schemas/Profile' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
  /v1/profiles/{id}/login-link:
    parameters: [{ $ref: '#/components/parameters/ProfileId' }]
    post:
      operationId: createProfileLoginLink
      responses:
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '501': { $ref: '#/components/responses/NotImplemented' }
  /v1/worker/testing/claim:
    post:
      security: [{ workerToken: [] }]
      operationId: claimTestingRun
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TestingWorkerClaim' } } } }
      responses:
        '200': { description: Exact attempt-bound TestingTask and private lease token., content: { application/json: { schema: { $ref: '#/components/schemas/TestingClaimResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { description: Testing authorization provider unavailable., content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /v1/worker/testing/runs/{run_id}/reconcile-claim:
    parameters: [{ $ref: '#/components/parameters/TestingRunId' }]
    post:
      security: [{ workerToken: [] }]
      operationId: claimTestingReconcile
      description: Issues fresh reconcile-only credentials for the same machine and attempt; these credentials cannot start or retry a Case.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TestingWorkerClaim' } } } }
      responses:
        '200': { description: Same-attempt reconcile task and private fresh lease token., content: { application/json: { schema: { $ref: '#/components/schemas/TestingReconcileClaimResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { description: Testing reconcile authorization provider unavailable., content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /v1/worker/testing/runs/{run_id}/heartbeat:
    parameters: [{ $ref: '#/components/parameters/TestingRunId' }]
    post:
      security: [{ workerToken: [] }]
      operationId: heartbeatTestingAttempt
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TestingHeartbeatRequest' } } } }
      responses:
        '200': { description: Extended lease and signed current-claim observation., content: { application/json: { schema: { $ref: '#/components/schemas/TestingHeartbeatResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/worker/testing/runs/{run_id}/local-accept:
    parameters: [{ $ref: '#/components/parameters/TestingRunId' }]
    post:
      security: [{ workerToken: [] }]
      operationId: acceptTestingAttemptLocally
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TestingAttemptBindingRequest' } } } }
      responses:
        '200': { description: Signed current-claim observation after durable local acceptance., content: { application/json: { schema: { $ref: '#/components/schemas/TestingCurrentClaimEnvelope' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/worker/testing/runs/{run_id}/running:
    parameters: [{ $ref: '#/components/parameters/TestingRunId' }]
    post:
      security: [{ workerToken: [] }]
      operationId: startTestingAttempt
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TestingAttemptBindingRequest' } } } }
      responses:
        '200': { description: Signed current-claim observation after execution begins., content: { application/json: { schema: { $ref: '#/components/schemas/TestingCurrentClaimEnvelope' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/worker/testing/runs/{run_id}/result:
    parameters: [{ $ref: '#/components/parameters/TestingRunId' }]
    post:
      security: [{ workerToken: [] }]
      operationId: commitTestingAttemptResult
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TestingTerminalCommitRequest' } } } }
      responses:
        '200': { description: Terminal projection acknowledgement., content: { application/json: { schema: { $ref: '#/components/schemas/TestingTerminalCommitAck' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/worker/testing/runs/{run_id}/reconcile:
    parameters: [{ $ref: '#/components/parameters/TestingRunId' }]
    post:
      security: [{ workerToken: [] }]
      operationId: reconcileTestingAttempt
      description: Same-machine terminal reconciliation for a durably accepted attempt; never starts or retries cases.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TestingTerminalCommitRequest' } } } }
      responses:
        '200': { description: Terminal projection acknowledgement., content: { application/json: { schema: { $ref: '#/components/schemas/TestingTerminalCommitAck' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/worker/testing/runs/{run_id}/not-accepted:
    parameters: [{ $ref: '#/components/parameters/TestingRunId' }]
    post:
      security: [{ workerToken: [] }]
      operationId: confirmTestingNotLocallyAccepted
      description: Records an exact Runtime-verified no-local-acceptance fact before releasing or requeueing the attempt.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TestingNoLocalAcceptanceRequest' } } } }
      responses:
        '200': { description: Updated run projection acknowledgement., content: { application/json: { schema: { $ref: '#/components/schemas/TestingRunMutationAck' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { description: Runtime fact verifier unavailable., content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /v1/worker/testing/claims/{run_id}/{claim_id}:
    parameters:
      - { $ref: '#/components/parameters/TestingRunId' }
      - { name: claim_id, in: path, required: true, schema: { $ref: '#/components/schemas/Identifier' } }
    get:
      security: [{ workerToken: [] }]
      operationId: resolveTestingCurrentClaim
      responses:
        '200': { description: Signed currentness statement with no raw lease token., content: { application/json: { schema: { $ref: '#/components/schemas/TestingCurrentClaimEnvelope' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/testing/claims/{run_id}/{claim_id}/resolve:
    parameters:
      - { $ref: '#/components/parameters/TestingRunId' }
      - { name: claim_id, in: path, required: true, schema: { $ref: '#/components/schemas/Identifier' } }
    post:
      security: []
      operationId: resolveTestingCurrentClaimForRuntime
      description: Runtime-facing nonce-bound currentness observation independent of worker token rotation.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TestingCurrentClaimResolveRequest' } } } }
      responses:
        '200': { description: Short-lived Ed25519-signed currentness statement with the caller nonce and no raw lease token., content: { application/json: { schema: { $ref: '#/components/schemas/TestingCurrentClaimEnvelope' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/worker/claim:
    post:
      security: [{ workerToken: [] }]
      operationId: claimTask
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/WorkerClaim' } } }
      responses:
        '200': { description: Claimed task, content: { application/json: { schema: { $ref: '#/components/schemas/ClaimResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
  /v1/worker/tasks/{id}/heartbeat:
    post:
      security: [{ workerToken: [] }]
      operationId: heartbeatTask
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Heartbeat' } } } }
      responses:
        '200': { description: Running task, content: { application/json: { schema: { $ref: '#/components/schemas/Task' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
  /v1/worker/tasks/{id}/needs-input:
    post:
      security: [{ workerToken: [] }]
      operationId: signalNeedsInput
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/WorkerLeaseRequest' } } } }
      responses:
        '200': { description: Task waiting for input, content: { application/json: { schema: { $ref: '#/components/schemas/Task' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
  /v1/worker/tasks/{id}/input:
    get:
      security: [{ workerToken: [] }]
      operationId: getRelayedInput
      description: Direct-connection compatibility route. Proxy-connected workers use POST /v1/worker/tasks/{id}/input/poll so credentials are carried in the body rather than query strings.
      parameters: [{ name: X-Talos-Lease-Token, in: header, required: true, schema: { type: string } }]
      responses:
        '200':
          description: Private input relay; input is omitted until human input is available.
          content: { application/json: { schema: { type: object, properties: { input: { $ref: '#/components/schemas/TaskInput' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/worker/tasks/{id}/input/poll:
    post:
      security: [{ workerToken: [] }]
      operationId: pollRelayedInput
      description: Proxy-compatible input poll. NyxID forwards the JSON body while stripping worker authentication headers.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/WorkerLeaseRequest' } } } }
      responses:
        '200':
          description: Private input relay; input is omitted until human input is available.
          content: { application/json: { schema: { type: object, properties: { input: { $ref: '#/components/schemas/TaskInput' } } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
  /v1/worker/tasks/{id}/actions/poll:
    parameters: [{ $ref: '#/components/parameters/TaskId' }]
    post:
      security: [{ workerToken: [] }]
      operationId: pollSessionAction
      description: Worker-only proxy-compatible poll for an interactive action or closing signal.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/WorkerLeaseRequest' } } } }
      responses:
        '200': { description: Pending worker action or closing signal, content: { application/json: { schema: { $ref: '#/components/schemas/WorkerActionPoll' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
  /v1/worker/tasks/{id}/actions/{actionId}/result:
    parameters:
      - { $ref: '#/components/parameters/TaskId' }
      - { $ref: '#/components/parameters/ActionId' }
    post:
      security: [{ workerToken: [] }]
      operationId: submitSessionActionResult
      description: Stores a correlated interactive action result. This route alone permits an 8 MiB JSON body for encoded screenshots.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/WorkerActionResult' } } } }
      responses:
        '200': { description: Stored result, content: { application/json: { schema: { type: object, required: [stored], properties: { stored: { type: boolean, const: true } } } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
  /v1/worker/tasks/{id}/result:
    post:
      security: [{ workerToken: [] }]
      operationId: submitTaskResult
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Result' } } } }
      responses:
        '200': { description: Final task, content: { application/json: { schema: { $ref: '#/components/schemas/Task' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
  /v1/worker/tasks/{id}/artifacts:
    post:
      security: [{ workerToken: [] }]
      operationId: uploadArtifact
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ArtifactUpload' } } } }
      responses:
        '201': { description: Task with artifact, content: { application/json: { schema: { $ref: '#/components/schemas/Task' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
  /v1/admin/pools:
    post:
      security: [{ adminToken: [] }]
      operationId: registerPool
      description: Administrative registration for org/platform pools and cross-user setup. User-owned private or org pools use POST /v1/pools.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AdminPool' } } } }
      responses:
        '201': { description: Registered pool, content: { application/json: { schema: { $ref: '#/components/schemas/RegisteredResource' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
  /v1/admin/machines:
    post:
      security: [{ adminToken: [] }]
      operationId: registerMachine
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AdminMachine' } } } }
      responses:
        '201': { description: Registered machine with worker token, content: { application/json: { schema: { $ref: '#/components/schemas/MachineTokenResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
  /v1/admin/machines/{id}/rotate-token:
    post:
      security: [{ adminToken: [] }]
      operationId: rotateMachineToken
      parameters: [{ $ref: '#/components/parameters/MachineId' }]
      requestBody: { content: { application/json: { schema: { type: object, properties: { worker_token: { type: string, minLength: 16 } } } } } }
      responses:
        '200': { description: Rotated worker token, content: { application/json: { schema: { $ref: '#/components/schemas/MachineTokenResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
  /v1/admin/profiles:
    post:
      security: [{ adminToken: [] }]
      operationId: registerProfile
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AdminProfile' } } } }
      responses:
        '201': { description: Registered profile, content: { application/json: { schema: { $ref: '#/components/schemas/RegisteredResource' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
  /v1/handoffs/{id}:
    get:
      security: [{ nyxIdentity: [] }]
      operationId: consumeHandoff
      description: Phase 1 validates ownership and expiry, marks a valid link used, then returns 501 because the hosted view is not implemented. Phase 3 will authenticate the hosted view through NyxID connect-link authorization instead of X-NyxID-Identity-Token.
      parameters: [{ $ref: '#/components/parameters/HandoffId' }]
      responses:
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '501': { $ref: '#/components/responses/NotImplemented' }
components:
  parameters:
    TaskId: { name: id, in: path, required: true, schema: { type: string } }
    ProfileId: { name: id, in: path, required: true, schema: { type: string } }
    MachineId: { name: id, in: path, required: true, schema: { type: string } }
    HandoffId: { name: id, in: path, required: true, schema: { type: string } }
    PoolId: { name: id, in: path, required: true, schema: { type: string } }
    SessionId: { name: id, in: path, required: true, schema: { type: string } }
    ActionId: { name: actionId, in: path, required: true, schema: { type: string } }
    WaitSeconds: { name: wait_seconds, in: query, required: false, schema: { type: integer, minimum: 0, maximum: 25, default: 25 }, description: Bounded long-poll duration, capped below upstream proxy timeouts. }
    TestingRunId: { name: run_id, in: path, required: true, schema: { $ref: '#/components/schemas/TestingRunIdValue' } }
  securitySchemes:
    nyxIdentity: { type: apiKey, in: header, name: X-NyxID-Identity-Token, description: Propagated NyxID identity token; maps the task to a user. }
    workerToken:
      type: http
      scheme: bearer
      description: Rotatable machine worker token. Direct requests may use X-Talos-Worker-Token with X-Talos-Worker-Id and X-Talos-Machine-Id, or Authorization Bearer with the two identity headers. Stock NyxID strips Authorization and all X-Talos-* headers, so proxy-compatible POST requests also carry worker_token, worker_id, and machine_id in their JSON body. Precedence is X-Talos-* headers, then Bearer plus identity headers, then body fields. The token remains bound to the selected machine id.
    adminToken: { type: apiKey, in: header, name: X-Talos-Admin-Token, description: Startup-configured administrative registration token. }
  responses:
    BadRequest: { description: Invalid JSON or boundary validation failure, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Unauthorized: { description: Missing or invalid identity, worker, or admin credentials, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    PayloadTooLarge: { description: Request body exceeds its route limit (1 MiB normally; 8 MiB for interactive action results), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    NotFound: { description: Resource not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Conflict: { description: State conflict, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Forbidden: { description: Identity-scoped resource belongs to another user, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    InternalError: { description: Internal server error, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    NotImplemented:
      description: Phase 2/3 machinery is not implemented in Phase 1.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  schemas:
    Sha256Digest: { type: string, pattern: '^sha256:[a-f0-9]{64}$' }
    Identifier: { type: string, minLength: 1, maxLength: 255, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$' }
    TestingRunIdValue: { type: string, minLength: 1, maxLength: 255, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*$' }
    IdempotencyKey: { type: string, minLength: 1, maxLength: 512, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$' }
    TalosReference: { type: string, minLength: 1, maxLength: 2048, pattern: '^talos://[A-Za-z0-9][A-Za-z0-9.-]*(/[A-Za-z0-9][A-Za-z0-9._-]*)+$' }
    AuthorizationReference: { type: string, minLength: 1, maxLength: 2048, pattern: '^authorization://[A-Za-z0-9][A-Za-z0-9.-]*(/[A-Za-z0-9][A-Za-z0-9._-]*)+$' }
    LocalQaReference: { type: string, minLength: 1, maxLength: 2048, pattern: '^local-qa://[A-Za-z0-9][A-Za-z0-9.-]*(/[A-Za-z0-9][A-Za-z0-9._-]*)+$' }
    RequestNonce: { type: string, minLength: 16, maxLength: 255, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$' }
    ArtifactReference: { type: string, minLength: 1, maxLength: 2048, pattern: '^artifact://[A-Za-z0-9][A-Za-z0-9.-]*(/[A-Za-z0-9][A-Za-z0-9._-]*)+$' }
    TestingCancelReason:
      type: string
      enum: [user_requested, deadline_exceeded, authorization_revoked, policy_revoked, system_shutdown]
    TestingControlStatus:
      type: string
      enum: [submitted, reserved, claimed, local_accepted, running, cancel_requested, closing, reconcile_required, completed, failed, cancelled, abandoned]
    TestingExecutionOutcome:
      type: string
      enum: [not_started, executing, passed, failed, blocked, error, cancelled, lost_or_inconclusive, unobserved]
    TestingEvidenceOutcome:
      type: string
      enum: [not_required, staging, complete, partial, unavailable, policy_blocked]
    TestingUploadOutcome:
      type: string
      enum: [not_required, pending, uploaded, upload_expired]
    TestingCleanupOutcome:
      type: string
      enum: [not_required, pending, complete, residual_retryable, residual_blocking, unobserved]
    ArtifactPointer:
      type: object
      additionalProperties: false
      required: [ref, digest]
      properties:
        ref: { $ref: '#/components/schemas/ArtifactReference' }
        digest: { $ref: '#/components/schemas/Sha256Digest' }
    VersionedArtifactPointer:
      type: object
      additionalProperties: false
      required: [schema, ref, digest]
      properties:
        schema: { $ref: '#/components/schemas/Identifier' }
        ref: { $ref: '#/components/schemas/ArtifactReference' }
        digest: { $ref: '#/components/schemas/Sha256Digest' }
    TestingInputs:
      type: object
      additionalProperties: false
      required: [schema_version, project_pack_snapshot, test_selection, testing_design_input_set, source_revision, structured_plan, environment_profile, testing_package]
      properties:
        schema_version: { const: talos.testing-input-references/v1 }
        project_pack_snapshot:
          allOf:
            - { $ref: '#/components/schemas/VersionedArtifactPointer' }
            - { properties: { schema: { const: pql.project-pack-snapshot/v1 } } }
        test_selection:
          allOf:
            - { $ref: '#/components/schemas/VersionedArtifactPointer' }
            - { properties: { schema: { const: pql.test-selection/v1 } } }
        testing_design_input_set:
          allOf:
            - { $ref: '#/components/schemas/VersionedArtifactPointer' }
            - { properties: { schema: { const: pql.testing-design-input-set.v1 } } }
        structured_plan:
          allOf:
            - { $ref: '#/components/schemas/VersionedArtifactPointer' }
            - { properties: { schema: { const: testing-structured-plan.v2 } } }
        environment_profile: { $ref: '#/components/schemas/ArtifactPointer' }
        source_revision:
          type: object
          additionalProperties: false
          required: [repository_id, exact_revision, ref, digest]
          properties:
            repository_id: { $ref: '#/components/schemas/Identifier' }
            exact_revision: { type: string, pattern: '^(?:[a-f0-9]{40}|[a-f0-9]{64})$' }
            ref: { $ref: '#/components/schemas/ArtifactReference' }
            digest: { $ref: '#/components/schemas/Sha256Digest' }
        testing_package: { $ref: '#/components/schemas/TestingPackageReference' }
    TestingBudgets:
      type: object
      additionalProperties: false
      required: [wall_time_ms, max_cases, max_actions, max_events, max_screenshots, max_screenshot_bytes, max_json_evidence_bytes, max_total_artifact_bytes]
      properties:
        wall_time_ms: { type: integer, minimum: 1, maximum: 600000 }
        max_cases: { type: integer, minimum: 1, maximum: 20 }
        max_actions: { type: integer, minimum: 1, maximum: 200 }
        max_events: { type: integer, minimum: 1, maximum: 2000 }
        max_screenshots: { type: integer, minimum: 0, maximum: 20 }
        max_screenshot_bytes: { type: integer, minimum: 1, maximum: 5242880 }
        max_json_evidence_bytes: { type: integer, minimum: 1, maximum: 1048576 }
        max_total_artifact_bytes: { type: integer, minimum: 1, maximum: 52428800 }
    TestingPolicy:
      type: object
      additionalProperties: false
      required: [network_scope, environment_port_handle_policy, allowed_actions, allowed_evidence_media, secret_refs, budgets]
      properties:
        network_scope: { const: environment_owned_loopback_exact_origins }
        environment_port_handle_policy:
          type: object
          additionalProperties: false
          required: [source, allow_unowned_loopback]
          properties: { source: { const: current_run_owned_handles }, allow_unowned_loopback: { const: false } }
        allowed_actions: { type: array, minItems: 1, maxItems: 11, items: { type: string, enum: [navigate, click, type, key, wait, screenshot, extract-structured-dom, assert-visible, assert-text, assert-url] } }
        allowed_evidence_media: { type: array, minItems: 1, maxItems: 2, items: { type: string, enum: [image/png, application/vnd.fkst.testing.sanitized+json] } }
        secret_refs: { type: array, maxItems: 0 }
        budgets: { $ref: '#/components/schemas/TestingBudgets' }
    TestingPolicyReference:
      type: object
      additionalProperties: false
      required: [schema, ref, digest]
      properties:
        schema: { const: talos.testing-execution-policy/v1 }
        ref: { $ref: '#/components/schemas/TalosReference' }
        digest: { $ref: '#/components/schemas/Sha256Digest' }
    TestingBudgetsReference:
      type: object
      additionalProperties: false
      required: [schema, ref, digest]
      properties:
        schema: { const: talos.testing-budgets/v1 }
        ref: { $ref: '#/components/schemas/TalosReference' }
        digest: { $ref: '#/components/schemas/Sha256Digest' }
    TestingPolicyBinding:
      type: object
      additionalProperties: false
      required: [policy, budgets]
      properties:
        policy: { $ref: '#/components/schemas/TestingPolicyReference' }
        budgets: { $ref: '#/components/schemas/TestingBudgetsReference' }
    TestingToolRequest:
      type: object
      additionalProperties: false
      required: [schema_version, idempotency_key, display_goal, inputs, execution_profile, placement_requirements, policy_binding, policy]
      properties:
        schema_version: { const: talos.testing-tool-request/v1 }
        idempotency_key: { $ref: '#/components/schemas/IdempotencyKey' }
        display_goal: { type: string, minLength: 1, maxLength: 1000 }
        inputs: { $ref: '#/components/schemas/TestingInputs' }
        execution_profile: { const: local_qa_agent_mvp }
        placement_requirements:
          type: object
          additionalProperties: false
          required: [testing_runtime]
          properties: { testing_runtime: { const: local-qa-mvp/v1 } }
        policy_binding: { $ref: '#/components/schemas/TestingPolicyBinding' }
        policy: { $ref: '#/components/schemas/TestingPolicy' }
    TestingCapabilities:
      type: object
      additionalProperties: false
      required: [schema_version, planning_contracts, tool_contracts, task_contracts, execution_profiles, runtime_capabilities, result_contracts, backends, browsers, secret_refs_supported, max_concurrency_per_machine, limits]
      properties:
        schema_version: { const: talos.testing-capabilities/v1 }
        planning_contracts: { type: array, minItems: 3, maxItems: 3, prefixItems: [{ const: pql.project-pack-snapshot/v1 }, { const: pql.test-selection/v1 }, { const: pql.testing-design-input-set.v1 }] }
        tool_contracts: { type: array, minItems: 1, maxItems: 1, prefixItems: [{ const: talos.testing-tool-request/v1 }] }
        task_contracts: { type: array, minItems: 1, maxItems: 1, prefixItems: [{ const: talos.testing-task/v1 }] }
        execution_profiles: { type: array, minItems: 1, maxItems: 1, prefixItems: [{ const: local_qa_agent_mvp }] }
        runtime_capabilities: { type: array, minItems: 1, maxItems: 1, prefixItems: [{ const: local-qa-mvp/v1 }] }
        result_contracts: { type: array, minItems: 3, maxItems: 3, prefixItems: [{ const: testing-case-result-set.v2 }, { const: testing-evidence-manifest.v1 }, { const: qa.local-cleanup-receipt/v2 }] }
        backends: { type: array, minItems: 1, maxItems: 1, prefixItems: [{ const: browser }] }
        browsers: { type: array, minItems: 1, maxItems: 1, prefixItems: [{ const: chromium }] }
        secret_refs_supported: { const: false }
        max_concurrency_per_machine: { const: 1 }
        limits: { $ref: '#/components/schemas/TestingBudgets' }
    TestingRunAcceptance:
      type: object
      additionalProperties: false
      required: [schema_version, run_id, accepted, replayed, control_status, request_digest, created_at]
      properties:
        schema_version: { const: talos.testing-run-acceptance/v1 }
        run_id: { $ref: '#/components/schemas/TestingRunIdValue' }
        accepted: { const: true }
        replayed: { type: boolean }
        control_status: { $ref: '#/components/schemas/TestingControlStatus' }
        request_digest: { $ref: '#/components/schemas/Sha256Digest' }
        created_at: { type: string, format: date-time }
    TestingRunAttempt:
      type: object
      additionalProperties: false
      required: [attempt_id, task_id, generation]
      properties:
        attempt_id: { $ref: '#/components/schemas/Identifier' }
        task_id: { $ref: '#/components/schemas/Identifier' }
        generation: { type: integer, minimum: 1 }
        machine_id: { $ref: '#/components/schemas/Identifier' }
    TestingRunProgress:
      type: object
      additionalProperties: false
      required: [phase, completed_cases, total_cases, last_event_sequence]
      properties:
        phase: { $ref: '#/components/schemas/Identifier' }
        completed_cases: { type: integer, minimum: 0 }
        total_cases: { type: integer, minimum: 0 }
        last_event_sequence: { type: integer, minimum: 0 }
    TestingRunSummary:
      type: object
      additionalProperties: false
      required: [total, passed, failed, blocked, error]
      properties:
        total: { type: integer, minimum: 0 }
        passed: { type: integer, minimum: 0 }
        failed: { type: integer, minimum: 0 }
        blocked: { type: integer, minimum: 0 }
        error: { type: integer, minimum: 0 }
    TestingAttemptBinding:
      type: object
      additionalProperties: false
      required: [run_id, task_id, attempt_id, generation, fence_token]
      properties:
        run_id: { $ref: '#/components/schemas/TestingRunIdValue' }
        task_id: { $ref: '#/components/schemas/Identifier' }
        attempt_id: { $ref: '#/components/schemas/Identifier' }
