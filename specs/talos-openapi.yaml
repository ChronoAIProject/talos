      required: [run_id, control_status, snapshot_version]
      properties:
        run_id: { $ref: '#/components/schemas/TestingRunIdValue' }
        control_status: { type: string, enum: [completed, failed, cancelled] }
        snapshot_version: { type: integer, minimum: 1 }
    TestingRunMutationAck:
      type: object
      additionalProperties: false
      required: [run_id, control_status, snapshot_version]
      properties:
        run_id: { $ref: '#/components/schemas/TestingRunIdValue' }
        control_status: { $ref: '#/components/schemas/TestingControlStatus' }
        snapshot_version: { type: integer, minimum: 1 }
    TaskCreate:
      type: object
      required: [kind, goal]
      properties:
        kind: { type: string, enum: [browse, computer_use] }
        goal: { type: string }
        site_hint: { type: string }
        profile_id: { type: string }
        pool_id: { type: string, description: Restricts scheduling to this visible pool. Foreign private pools are rejected. }
        constraints: { type: object, description: Budget is advisory-only in Phase 1; deadline is enforced by the expiry sweep., properties: { budget: { type: number }, deadline: { type: string, format: date-time }, requirements: { type: object, additionalProperties: { oneOf: [{ type: string }, { type: boolean }] } } } }
        mode: { type: string, enum: [read_only, act], default: read_only }
        callback: { type: string, format: uri }
    TaskInput:
      type: object
      required: [kind, value]
      properties: { kind: { type: string, enum: [choice, text, otp] }, value: { type: string } }
    Task:
      type: object
      required: [id, userId, kind, goal, interaction, status, createdAt, updatedAt, findings, artifacts]
      properties:
        id: { type: string }
        userId: { type: string }
        kind: { type: string, enum: [browse, computer_use] }
        goal: { type: string }
        siteHint: { type: string }
        profileId: { type: string }
        poolId: { type: string }
        constraints: { type: object }
        mode: { type: string, enum: [read_only, act] }
        interaction: { type: string, enum: [autonomous, interactive] }
        callback: { type: string, format: uri }
        status: { type: string, enum: [submitted, claimed, running, needs_input, handoff, closing, completed, failed, cancelled] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        claimedAt: { type: string, format: date-time }
        findings: { type: array, items: { type: object } }
        artifacts: { type: array, items: { $ref: '#/components/schemas/Artifact' } }
        error: { $ref: '#/components/schemas/TaskError' }
        handoff: { type: object, required: [url, expiresAt], properties: { url: { type: string }, expiresAt: { type: string, format: date-time } } }
    SessionCreate:
      type: object
      additionalProperties: false
      properties:
        pool_id: { type: string, description: Restricts scheduling to a pool visible to the caller. }
        profile_id: { type: string }
        mode: { type: string, enum: [read_only, act], default: read_only }
        constraints: { type: object, properties: { budget: { type: number, minimum: 0 }, deadline: { type: string, format: date-time }, requirements: { type: object, additionalProperties: { oneOf: [{ type: string }, { type: boolean }] } } } }
    Session:
      type: object
      required: [id, status, mode, createdAt, updatedAt]
      properties:
        id: { type: string }
        status: { type: string, enum: [submitted, claimed, running, closing, completed, failed, cancelled] }
        mode: { type: string, enum: [read_only, act] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        pendingActionId: { type: string }
        lastActionId: { type: string }
    SessionActionRequest:
      type: object
      additionalProperties: false
      required: [action]
      properties: { action: { $ref: '#/components/schemas/SessionAction' } }
    SessionAction:
      oneOf:
        - { type: object, additionalProperties: false, required: [type], properties: { type: { const: screenshot }, format: { type: string, enum: [jpeg, png], default: jpeg }, quality: { type: integer, minimum: 1, maximum: 100, default: 70 } } }
        - { type: object, additionalProperties: false, required: [type, x, y], properties: { type: { const: click }, x: { type: number }, y: { type: number }, button: { type: string, enum: [left, middle, right], default: left } } }
        - { type: object, additionalProperties: false, required: [type, text], properties: { type: { const: type }, text: { type: string, maxLength: 10000 } } }
        - { type: object, additionalProperties: false, required: [type, key], properties: { type: { const: key }, key: { type: string } } }
        - { type: object, additionalProperties: false, required: [type, deltaY], properties: { type: { const: scroll }, deltaX: { type: number, default: 0 }, deltaY: { type: number } } }
        - { type: object, additionalProperties: false, required: [type, milliseconds], properties: { type: { const: wait }, milliseconds: { type: integer, minimum: 0, maximum: 60000 } } }
        - { type: object, additionalProperties: false, required: [type, url], properties: { type: { const: navigate }, url: { type: string, format: uri } } }
        - { type: object, additionalProperties: false, required: [type, selector], properties: { type: { const: extract-structured-dom }, selector: { type: string } } }
        - { type: object, additionalProperties: false, required: [type, nodeId, action], properties: { type: { const: act-on-a11y-node }, nodeId: { type: string }, action: { type: string, enum: [click, type] }, text: { type: string } } }
    SessionActionResponse:
      type: object
      required: [action_id, status]
      properties:
        action_id: { type: string }
        status: { type: string, enum: [completed, pending] }
        result: { $ref: '#/components/schemas/ActionResult' }
    ActionResult:
      type: object
      additionalProperties: false
      properties:
        screenshot:
          type: object
          required: [mimeType, data, width, height]
          properties:
            mimeType: { type: string, enum: [image/jpeg, image/png] }
            data: { type: string, contentEncoding: base64 }
            width: { type: integer, minimum: 0 }
            height: { type: integer, minimum: 0 }
        value: {}
        error: { $ref: '#/components/schemas/TaskError' }
    Handoff:
      type: object
      required: [handoff_url, expires]
      properties: { handoff_url: { type: string }, expires: { type: string, format: date-time } }
    Artifact:
      type: object
      required: [id, name, contentType, size, uri, createdAt]
      properties: { id: { type: string }, name: { type: string }, contentType: { type: string }, size: { type: integer }, uri: { type: string, format: uri }, createdAt: { type: string, format: date-time } }
    ClaimResponse:
      type: object
      required: [task, lease, leaseToken]
      properties:
        task: { $ref: '#/components/schemas/Task' }
        lease: { $ref: '#/components/schemas/Lease' }
        leaseToken: { type: string, minLength: 1 }
    Lease:
      type: object
      required: [taskId, workerId, machineId, expiresAt]
      properties: { taskId: { type: string }, workerId: { type: string }, machineId: { type: string }, expiresAt: { type: string, format: date-time } }
    WorkerCredentials:
      type: object
      properties:
        worker_token: { type: string, minLength: 1, writeOnly: true, description: Proxy-compatible worker token body carrier. }
        worker_id: { type: string, minLength: 1, description: Proxy-compatible worker id body carrier. }
        machine_id: { type: string, minLength: 1, description: Proxy-compatible machine id body carrier. }
    WorkerClaim:
      allOf:
        - { $ref: '#/components/schemas/WorkerCredentials' }
        - type: object
          required: [worker_id, machine_id]
    TestingWorkerClaim:
      type: object
      additionalProperties: false
      required: [worker_id, machine_id]
      properties:
        worker_token: { type: string, minLength: 1, writeOnly: true }
        worker_id: { type: string, minLength: 1, maxLength: 255 }
        machine_id: { type: string, minLength: 1, maxLength: 255 }
    Heartbeat:
      allOf:
        - { $ref: '#/components/schemas/WorkerCredentials' }
        - type: object
          required: [lease_token]
          properties: { lease_token: { type: string }, extend_seconds: { type: integer, minimum: 1, maximum: 300 } }
    Result:
      allOf:
        - { $ref: '#/components/schemas/WorkerCredentials' }
        - type: object
          required: [lease_token, status]
          properties: { lease_token: { type: string }, status: { type: string, enum: [completed, failed] }, findings: { type: array, items: { type: object } }, error: { type: object } }
    ArtifactUpload:
      allOf:
        - { $ref: '#/components/schemas/WorkerCredentials' }
        - type: object
          required: [lease_token, name, content_type, size, uri]
          properties: { lease_token: { type: string }, name: { type: string }, content_type: { type: string }, size: { type: integer }, uri: { type: string, format: uri } }
    WorkerLeaseRequest:
      allOf:
        - { $ref: '#/components/schemas/WorkerCredentials' }
        - type: object
          required: [lease_token]
          properties: { lease_token: { type: string } }
    WorkerActionPoll:
      type: object
      required: [closing]
      properties:
        closing: { type: boolean }
        action:
          type: object
          required: [id, action]
          properties: { id: { type: string }, action: { $ref: '#/components/schemas/SessionAction' } }
    WorkerActionResult:
      allOf:
        - { $ref: '#/components/schemas/WorkerCredentials' }
        - type: object
          required: [lease_token, result]
          properties:
            lease_token: { type: string }
            result: { $ref: '#/components/schemas/ActionResult' }
    AdminPool:
      type: object
      required: [id, visibility]
      properties: { id: { type: string }, visibility: { type: string, enum: [private, org, platform] }, owner_user_id: { type: string }, tags: { type: object }, shared_with_groups: { type: array, items: { type: string } } }
    AdminMachine:
      type: object
      required: [id, pool_id]
      properties: { id: { type: string }, pool_id: { type: string }, tags: { type: object }, capacity: { type: integer }, online: { type: boolean }, worker_token: { type: string, minLength: 16, description: Omit to have Talos issue a rotatable token. } }
    AdminProfile:
      type: object
      required: [id, user_id]
      properties: { id: { type: string }, user_id: { type: string }, machine_id: { type: string } }
    PrivatePoolCreate:
      type: object
      additionalProperties: false
      properties:
        id: { type: string, description: Omit for a server-generated id. }
        visibility: { type: string, enum: [private, org], default: private }
        tags: { type: object, additionalProperties: { oneOf: [{ type: string }, { type: boolean }] } }
        shared_with_groups: { type: array, items: { type: string }, description: Group slugs allowed to see an org pool; empty is owner-only. }
    PoolPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        visibility: { type: string, enum: [private, org] }
        tags: { type: object, additionalProperties: { oneOf: [{ type: string }, { type: boolean }] } }
        shared_with_groups: { type: array, items: { type: string }, description: Group slugs allowed to see an org pool; empty is owner-only. }
    Pool:
      type: object
      required: [id, visibility, ownerUserId, tags]
      properties:
        id: { type: string }
        visibility: { type: string, enum: [private, org, platform] }
        ownerUserId: { type: string }
        tags: { type: object, additionalProperties: { oneOf: [{ type: string }, { type: boolean }] } }
        sharedWithGroups: { type: array, items: { type: string }, description: Groups with visibility to an org pool. }
    PrivateMachineCreate:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id: { type: string }
        tags: { type: object, additionalProperties: { oneOf: [{ type: string }, { type: boolean }] } }
        capacity: { type: integer, minimum: 1, default: 1 }
        online: { type: boolean, default: true }
    Machine:
      type: object
      required: [id, tags, capacity, online, activeLeases]
      properties:
        id: { type: string }
        tags: { type: object, additionalProperties: { oneOf: [{ type: string }, { type: boolean }] } }
        capacity: { type: integer, minimum: 1 }
        online: { type: boolean }
        activeLeases: { type: integer, minimum: 0 }
    PrivateProfileCreate:
      type: object
      additionalProperties: false
      properties:
        id: { type: string, description: Omit for a server-generated id. }
        machine_id: { type: string }
    Profile:
      type: object
      required: [id, userId]
      properties:
        id: { type: string }
        userId: { type: string }
        machineId: { type: string }
    RegisteredResource:
      type: object
      required: [id]
      properties: { id: { type: string } }
    MachineTokenResponse:
      type: object
      required: [id, worker_token]
      properties:
        id: { type: string }
        worker_token: { type: string, minLength: 16 }
        rotated: { type: boolean }
    Error:
      type: object
      required: [error]
      properties: { error: { $ref: '#/components/schemas/TaskError' } }
    TestingCursorExpiredError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, retryable, replacement_cursor, snapshot_ref, snapshot_version, snapshot_digest]
          properties:
            code: { const: cursor_expired }
            message: { type: string, minLength: 1 }
            retryable: { const: true }
            replacement_cursor: { type: string, minLength: 32, maxLength: 4096 }
            snapshot_ref: { $ref: '#/components/schemas/TalosReference' }
            snapshot_version: { type: integer, minimum: 1 }
            snapshot_digest: { $ref: '#/components/schemas/Sha256Digest' }
    WebhookEvent:
      type: object
      required: [id, type, taskId, userId, timestamp, payload]
      properties:
        id: { type: string }
        type: { type: string, enum: [task.state_changed, task.needs_input, task.handoff_requested, task.completed] }
        taskId: { type: string }
        userId: { type: string }
        timestamp: { type: string, format: date-time }
        payload:
          oneOf:
            - { $ref: '#/components/schemas/StateChangedPayload' }
            - { $ref: '#/components/schemas/NeedsInputPayload' }
            - { $ref: '#/components/schemas/HandoffRequestedPayload' }
            - { $ref: '#/components/schemas/CompletedPayload' }
        delivery: { $ref: '#/components/schemas/WebhookDelivery' }
    StateChangedPayload:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [submitted, claimed, running, needs_input, handoff, closing, completed, failed, cancelled] }
        error: { $ref: '#/components/schemas/TaskError' }
    NeedsInputPayload:
      type: object
      required: [status]
      properties: { status: { type: string, const: needs_input } }
    HandoffRequestedPayload:
      type: object
      required: [handoff_url, expires]
      properties: { handoff_url: { type: string }, expires: { type: string, format: date-time } }
    CompletedPayload:
      type: object
      required: [status]
      properties: { status: { type: string, const: completed } }
    WebhookDelivery:
      type: object
      required: [status, attempts]
      properties:
        status: { type: string, enum: [pending, delivered, failed] }
        attempts: { type: integer, minimum: 0 }
        lastAttemptAt: { type: string, format: date-time }
        lastError: { type: string }
    TaskError:
      type: object
      required: [code, message]
      properties: { code: { type: string }, message: { type: string } }
x-webhook-signing:
  scheme: HMAC-SHA256
  headers: X-Talos-Webhook-Timestamp, X-Talos-Webhook-Signature
  signed_payload: '{timestamp}.{raw_json_body}'
  replay_tolerance_seconds: 300
x-webhooks:
  task.state_changed:
    payload: { $ref: '#/components/schemas/WebhookEvent' }
  task.needs_input:
    payload: { $ref: '#/components/schemas/WebhookEvent' }
  task.handoff_requested:
    payload: { $ref: '#/components/schemas/WebhookEvent' }
  task.completed:
    payload: { $ref: '#/components/schemas/WebhookEvent' }
